<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local.AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="brand"><div class="brand-mark">✦</div><span>Local.AI</span></div>
        <button class="new-chat" onclick="newChat()"><span>＋</span> New chat</button>
        <div class="chat-label">CHATS</div>
        <div id="chatList" class="chat-list"></div>
        <div class="sidebar-bottom">
            <div class="status"><span class="dot"></span><span>Local • Ollama</span></div>
            <button class="clear-all" onclick="clearAllChats()">Clear chats</button>
        </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
            <div class="model-name"><span class="online-dot"></span><span id="modelLabel">Local AI</span></div>
        </header>

        <section id="messages" class="messages"></section>

        <section id="welcome" class="welcome">
            <div class="welcome-icon">✦</div>
            <h1>What can I help with?</h1>
            <p>Private AI running locally on your PC.</p>
            <div class="suggestions">
                <button onclick="useSuggestion('Explain pointers in C with a simple example')">Explain pointers in C</button>
                <button onclick="useSuggestion('Help me understand machine learning from the basics')">Teach me ML</button>
                <button onclick="useSuggestion('Write a simple Python program and explain it')">Write Python code</button>
                <button onclick="useSuggestion('Explain how Transformers work')">Explain Transformers</button>
            </div>
        </section>

        <div class="composer-wrap">
            <div class="composer">
                <textarea id="message" rows="1" placeholder="Message your local AI..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
                <button id="sendButton" class="send" onclick="sendMessage()" aria-label="Send">↑</button>
            </div>
            <div class="hint">Enter to send • Shift + Enter for a new line</div>
        </div>
    </main>
</div>
<script src="app.js"></script>
</body>
</html>
